id: com.ambient.app
# GNOME runtime (not freedesktop) because Tauri 2 / wry links against
# javascriptcoregtk-4.1 + webkit2gtk-4.1, which the freedesktop Platform
# does not ship. GNOME 46 is built on freedesktop 24.08 underneath, so
# the freedesktop SDK extensions below remain version-compatible.
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  # Stay on node20 — node22 + npm 11 reliably hits "Exit handler never called!"
  # inside the flatpak-builder sandbox. node20 ships npm 10 which doesn't.
  - org.freedesktop.Sdk.Extension.node20

command: ambient

finish-args:
  # Network — required for source APIs (NASA, Unsplash, Pexels, OpenAI,
  # Pollinations) and emoji CDN.
  - --share=network
  - --share=ipc
  # GUI
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # System tray
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
  # COSMIC wallpaper config lives in ~/.config/cosmic/. The wallpaper crate
  # also shells out to GNOME's gsettings, KDE's qdbus, etc. — all need
  # config write access.
  - --filesystem=xdg-config:rw
  # Wallpapers we generate are saved to the user's app data dir, which inside
  # the sandbox is under ~/.var/app/com.ambient.app/data — already writable
  # by default. xdg-pictures is for the optional local-folder source.
  - --filesystem=xdg-pictures:rw

build-options:
  # Explicitly share the host network during the build phase. Local
  # flatpak-builder usually does this by default, but CI runners (and
  # newer flatpak-builder versions) may sandbox DNS, which makes
  # `npm install` fail with EAI_AGAIN on registry.npmjs.org.
  build-args:
    - --share=network
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node20/bin
  env:
    CARGO_HOME: /run/build/ambient/cargo
    # Silence npm's interactive output — funding/audit notices write to a
    # pipe the flatpak-builder sandbox sometimes closes early, which is
    # what triggers the "Exit handler never called!" hang.
    npm_config_fund: 'false'
    npm_config_audit: 'false'
    npm_config_progress: 'false'
    # Retry transient DNS / registry errors instead of bailing on the
    # first hiccup; --fetch-retries default is 2 with a short backoff.
    npm_config_fetch_retries: '5'
    npm_config_fetch_retry_mintimeout: '20000'
    npm_config_fetch_timeout: '300000'

modules:
  - name: ambient
    buildsystem: simple
    build-commands:
      # NOTE: For Flathub submission, npm + cargo must be vendored offline.
      # Generate offline manifests:
      #   pip install flatpak-node-generator
      #   flatpak-node-generator npm package-lock.json
      #   flatpak-builder-tools/cargo/flatpak-cargo-generator.py \
      #     src-tauri/Cargo.lock -o cargo-sources.json
      # Then reference them as additional 'sources' below.
      #
      # Dev/CI uses `npm install` (no `--ci`) because the repo ships only
      # bun.lock; npm regenerates its own lockfile at build time.
      # Flathub will require a vendored package-lock.json anyway.
      - npm install --no-fund --no-audit --no-progress
      - npm run build
      - cd src-tauri && cargo build --release --locked
      - install -Dm755 src-tauri/target/release/ambient /app/bin/ambient
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/com.ambient.app.png
      - install -Dm644 src-tauri/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/com.ambient.app.png
      - install -Dm644 flatpak/com.ambient.app.desktop /app/share/applications/com.ambient.app.desktop
      - install -Dm644 flatpak/com.ambient.app.metainfo.xml /app/share/metainfo/com.ambient.app.metainfo.xml
    sources:
      - type: dir
        path: ..
