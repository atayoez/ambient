<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!--
    Ambient banner — used as:
    - Polar product/checkout image (16:9, 1920x1080)
    - OpenGraph / Twitter card image on ambient.oezcan.me

    Reuses the same Cosmic palette and aurora-ribbon motif as the app
    icon so visual identity holds across surfaces.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0814" />
      <stop offset="100%" stop-color="#16102b" />
    </linearGradient>

    <radialGradient id="glow-violet" cx="0.25" cy="0.4" r="0.7">
      <stop offset="0%" stop-color="rgba(124,92,255,0.45)" />
      <stop offset="100%" stop-color="rgba(124,92,255,0)" />
    </radialGradient>

    <radialGradient id="glow-pink" cx="0.78" cy="0.65" r="0.6">
      <stop offset="0%" stop-color="rgba(236,72,153,0.32)" />
      <stop offset="100%" stop-color="rgba(236,72,153,0)" />
    </radialGradient>

    <radialGradient id="glow-amber" cx="0.6" cy="0.85" r="0.5">
      <stop offset="0%" stop-color="rgba(251,191,36,0.18)" />
      <stop offset="100%" stop-color="rgba(251,191,36,0)" />
    </radialGradient>

    <linearGradient id="title-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f1ecff" />
      <stop offset="100%" stop-color="#d6bcff" />
    </linearGradient>

    <linearGradient id="aurora" x1="0" y1="0.5" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#7c5cff" />
      <stop offset="35%" stop-color="#ec4899" />
      <stop offset="70%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f1ecff" />
    </linearGradient>

    <clipPath id="iconSquircle">
      <rect x="770" y="170" width="380" height="380" rx="84" ry="84" />
    </clipPath>
  </defs>

  <!-- Backdrop -->
  <rect width="1920" height="1080" fill="url(#bg)" />
  <rect width="1920" height="1080" fill="url(#glow-violet)" />
  <rect width="1920" height="1080" fill="url(#glow-pink)" />
  <rect width="1920" height="1080" fill="url(#glow-amber)" />

  <!-- Stars across the upper half -->
  <g fill="#f1ecff" opacity="0.45">
    <circle cx="160"  cy="180" r="2.8" />
    <circle cx="320"  cy="110" r="1.8" />
    <circle cx="500"  cy="240" r="2.2" />
    <circle cx="680"  cy="150" r="1.6" />
    <circle cx="1280" cy="120" r="2.4" />
    <circle cx="1440" cy="220" r="1.9" />
    <circle cx="1620" cy="160" r="2.1" />
    <circle cx="1780" cy="280" r="1.5" />
    <circle cx="140"  cy="380" r="1.7" />
    <circle cx="1830" cy="430" r="2" />
  </g>

  <!-- Icon: mini squircle with aurora ribbon, matches the app icon -->
  <g clip-path="url(#iconSquircle)">
    <rect x="770" y="170" width="380" height="380" fill="#0c0a1f" />
    <path
      d="M 730 460 Q 850 380 970 420 T 1180 380 L 1180 580 L 730 580 Z"
      fill="url(#aurora)"
      opacity="0.95"
    />
    <rect
      x="770"
      y="170"
      width="380"
      height="380"
      fill="rgba(255,255,255,0.06)"
    />
  </g>
  <rect
    x="770"
    y="170"
    width="380"
    height="380"
    rx="84"
    ry="84"
    fill="none"
    stroke="rgba(255,255,255,0.14)"
    stroke-width="2"
  />

  <!-- Wordmark + tagline -->
  <text
    x="960"
    y="730"
    text-anchor="middle"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="132"
    font-weight="700"
    letter-spacing="-4"
    fill="url(#title-grad)"
  >Ambient</text>

  <text
    x="960"
    y="810"
    text-anchor="middle"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="38"
    font-weight="400"
    letter-spacing="-0.5"
    fill="#a1a1aa"
  >Wallpapers that move with you</text>

  <!-- Price pill -->
  <g transform="translate(960 920)">
    <rect
      x="-220"
      y="-32"
      width="440"
      height="64"
      rx="32"
      ry="32"
      fill="rgba(255,255,255,0.06)"
      stroke="rgba(255,255,255,0.18)"
      stroke-width="1.5"
    />
    <text
      x="0"
      y="9"
      text-anchor="middle"
      font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
      font-size="22"
      font-weight="600"
      letter-spacing="2"
      fill="#f1ecff"
    >$15 ONE-TIME · macOS · WINDOWS · LINUX</text>
  </g>
</svg>
