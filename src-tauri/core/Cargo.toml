# ambient-core — Ambient's Tauri-independent backend: the pattern
# renderer, source fetchers, AI generation, library/settings/license
# stores, secrets, and the desktop wallpaper-apply pipeline.
#
# No tauri dependency by design: the crate is consumed by src-tauri's
# thin command wrappers today and stays reusable for any future shell
# (Tauri mobile, a native UI, a CLI). The shell owns the event bus
# (events::set_sink), the data-dir resolution (state::init), and
# everything window/tray/webview.
#
# Internal crate: version is never bumped (release.sh only versions the
# app package) and it is never published.
[package]
name = "ambient-core"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
# Rust-side HTTP client for license validation, source APIs (NASA,
# Bing, Unsplash, Pexels, Wallhaven, Picsum), AI generation
# (Pollinations, OpenAI), and image downloads. rustls + webpki-roots
# to stay off the system OpenSSL.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots", "json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Image decoding for the Library thumbnail cache. Minimal feature set:
# just the formats the Library can actually store.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# sync (RwLock, watch) owns the in-memory settings/library/license
# state; macros + time + rt for the render pipeline's spawn_blocking
# and the source caches; rt-multi-thread for the block_in_place that
# keeps store persistence from stalling a runtime worker (the shells
# run multithread runtimes).
tokio = { version = "1", features = ["sync", "macros", "time", "rt", "rt-multi-thread"] }
# Software 2D rasterizer for the Pattern renderer. Pure Rust, no GPU
# dependency, fast enough for live preview at thumbnail res +
# native-res export via spawn_blocking.
tiny-skia = "0.12"
# base64-encoded data URLs for the preview pipeline (see renderer.rs
# for why raw IPC bytes were abandoned).
base64 = "0.22"
# Path-segment encoding for the Pollinations prompt-in-URL pattern.
urlencoding = "2"
# Local-date formatting for the NASA APOD daily cache key. clock only.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# OS keyring for BYO API keys. Per-platform store crates below register
# the default backend at startup (secrets.rs::init); platforms without
# one (headless Linux, mobile) fall back to a mode-0600 JSON file.
keyring-core = "1"
# XDG/known-folder Pictures-dir lookup for the wallpaper output dir —
# replaces Tauri's app.path().picture_dir(). The app-data dir itself is
# NOT resolved here: the shell injects it via state::init so core can
# never disagree with the shell about where user data lives.
directories = "6"
# secrets.rs fallback warn!.
tracing = "0.1"

# Cross-platform OS wallpaper-set — desktop OSes only. Mobile targets
# route through the shell-registered setter instead
# (desktop.rs::set_os_setter; the Tauri shell wires its wallpaper
# plugin in there), so the crate must not even build for them.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
wallpaper = "3"
# Headless GPU renderer (gpu.rs): runs the SAME fragment shaders as the live
# wallpaper / WebGL preview (the Qt .frag, via naga's GLSL frontend) to a PNG,
# so the static render matches the animated look. Desktop-only; mobile and any
# GPU-init failure fall back to the tiny-skia renderer. `glsl` enables naga's
# GLSL-in; defaults keep wgsl + the per-platform backends.
wgpu = { version = "24", features = ["glsl"] }
pollster = "0.4"
bytemuck = "1"

# Per-platform keyring backends, registered as the keyring-core default
# in secrets.rs::init. See src-tauri's pre-extraction Cargo.toml history
# for the feature rationale (`keychain` vs `protected` on macOS, etc.).
# (No Android/iOS entries: keyring-core finds no store there and
# secrets.rs falls back to the mode-0600 JSON file.)
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }
