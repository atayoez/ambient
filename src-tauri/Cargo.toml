# The Tauri shell. Domain logic lives in the ambient-core workspace
# member (core/) — this crate owns only what is inherently shell:
# the webview/window lifecycle, tray, solo-instance handoff, updater,
# desktop integration (AppImage/autostart), the rotation scheduler, and
# the thin #[tauri::command] wrappers in src/commands.rs.
[package]
name = "ambient"
version = "1.2.0"
description = "Cross-platform wallpaper app with dynamic pattern generation."
edition = "2024"

# Workspace root: src-tauri stays the cargo root on purpose so the
# target dir (src-tauri/target) and lockfile (src-tauri/Cargo.lock)
# keep their paths — CI bundle globs, packaging scripts, and the rpm
# signing bind mounts all reference them.
[workspace]
members = ["core"]

# Tray dependency override (Linux). Tauri's tray stack pulls
# libappindicator-sys, whose loader dlopens libayatana-appindicator3 first;
# recent builds of that lib print a deprecation `g_warning` to stderr on
# every launch. Our vendored copy only reverses the load order to prefer the
# (ABI-identical, non-deprecated) libappindicator3 — see vendor/.../src/lib.rs.
[patch.crates-io]
libappindicator-sys = { path = "vendor/libappindicator-sys" }

[lib]
name = "ambient_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The Tauri-independent backend: renderer, sources, AI generation,
# settings/library/license stores, secrets, wallpaper apply.
ambient-core = { path = "core" }
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
# Process introspection for the "new launch wins" solo-instance handoff
# (solo_instance.rs). When a second `ambient` is launched, the new
# process reads the PID file written by the previous instance, verifies
# the live process really is an `ambient` binary (defends against PID
# rollover), sends SIGTERM, and only then proceeds with its own
# startup. Cheaper + simpler than rolling our own /proc reader +
# Windows OpenProcess paths.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# sync/macros/time for the rotation scheduler's select! + sleep loops.
tokio = { version = "1", features = ["sync", "macros", "time", "rt"] }
# Structured logging — replaces scattered eprintln! calls so log
# levels can be filtered at runtime via RUST_LOG and so future file-sink
# integrations are one-subscriber-add away. tracing-subscriber's
# `env-filter` reads RUST_LOG, `fmt` is the terminal printer; both
# default features are intentionally trimmed.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }

# Updater plugin handles signed delta installs — desktop only: mobile
# updates ship through the store / APK installs and the plugin has no
# mobile support, so it must not even build there.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

# Mobile wallpaper-set bridge (Android WallpaperManager). Registered in
# lib.rs setup and routed into ambient_core::desktop::set_os_setter.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-wallpaper = { path = "../plugins/wallpaper" }

# reqwest's rustls stack (ambient-core) verifies TLS through
# rustls-platform-verifier, which on Android needs a one-time JNI init
# with the JVM + app Context BEFORE any HTTPS request — otherwise every
# request panics ("Expect rustls-platform-verifier to be initialized").
# jni must stay in lockstep with the version rustls-platform-verifier
# itself uses (0.21) so the JNIEnv types are identical.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
rustls-platform-verifier = "0.6"

# Windows live-wallpaper delivery (live_win.rs): the WorkerW window-parenting
# Win32 calls. Same major as Tauri's own `windows` dep so the build doesn't
# pull a second copy.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

# macOS live-wallpaper delivery (live_mac.rs): AppKit calls to place the
# background window at the desktop window level. objc2 versions match the
# ones Tauri's own macOS path already pulls, so there's no second copy.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSResponder",
    "NSWindow",
    "NSScreen",
] }

# Release profile tuned for binary size + load-time RSS. Trade-off:
# release builds get slower (codegen-units=1, fat LTO), but the resulting
# binary is ~20-30% smaller, starts faster, and uses noticeably less
# resident memory before the WebView spins up. panic=abort drops the
# unwinding machinery, which Ambient doesn't use anywhere — every Result
# is handled explicitly.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

# Optimize third-party crates even in debug builds — image / tiny-skia /
# png are CPU-bound and ~50× slower at opt-level=0, which made the first
# preview render under `tauri dev` take 10+ seconds.
[profile.dev.package."*"]
opt-level = 3

# Our own crates at opt-level=1 in dev too: the renderer's hot loops
# (emoji compositing, dot/shape placement, the per-pixel paths) were the
# remaining bottleneck once deps were optimized — opt-0 left apply/preview
# renders sluggish under `tauri dev`. opt-level=1 is the sweet spot:
# renders feel instant, incremental compiles stay quick.
[profile.dev]
opt-level = 1
