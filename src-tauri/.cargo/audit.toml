# cargo-audit config — read by the Security workflow's audit step
# (rustsec/audit-check runs with working-directory: ./src-tauri, so this
# .cargo/audit.toml is picked up).
#
# Every ID below is an INFORMATIONAL advisory (unmaintained / unsound) —
# `cargo audit` reports ZERO actual vulnerabilities. They're all in
# transitive dependencies we don't control: the gtk-rs GTK3 stack that
# Tauri's WebKitGTK backend (wry) pulls in, plus a few transitive helper
# crates. They can't be fixed from here until Tauri moves off GTK3, so we
# ignore them to keep the audit signal meaningful — a real vulnerability
# (or any new advisory not listed here) still fails the job. Revisit when
# Tauri adopts gtk4 / a different Linux webview.
[advisories]
ignore = [
  # gtk-rs GTK3 bindings — no longer maintained (transitive via Tauri/wry).
  "RUSTSEC-2024-0411", # gdkwayland-sys
  "RUSTSEC-2024-0412", # gdk
  "RUSTSEC-2024-0413", # atk
  "RUSTSEC-2024-0414", # gdkx11-sys
  "RUSTSEC-2024-0415", # gtk
  "RUSTSEC-2024-0416", # atk-sys
  "RUSTSEC-2024-0417", # gdkx11
  "RUSTSEC-2024-0418", # gdk-sys
  "RUSTSEC-2024-0419", # gtk3-macros
  "RUSTSEC-2024-0420", # gtk-sys
  "RUSTSEC-2024-0429", # glib — VariantStrIter unsoundness (unused path)
  # gtk-layer-shell GTK3 bindings — no longer maintained. Direct dep for the
  # Linux layer-shell live wallpaper; it must match the gtk 0.18 Tauri/wry
  # uses, so it moves to the gtk4 bindings only when Tauri does.
  "RUSTSEC-2024-0422", # gtk-layer-shell
  "RUSTSEC-2024-0423", # gtk-layer-shell-sys
  # Other transitive unmaintained helper crates.
  "RUSTSEC-2024-0370", # proc-macro-error (build-time proc-macro dep)
  "RUSTSEC-2024-0436", # paste (build-time proc-macro, via wgpu-hal's metal backend)
  "RUSTSEC-2025-0075", # unic-char-range
  "RUSTSEC-2025-0080", # unic-common
  "RUSTSEC-2025-0081", # unic-char-property
  "RUSTSEC-2025-0098", # unic-ucd-version
  "RUSTSEC-2025-0100", # unic-ucd-ident
  # zvariant/zbus_names were merged into zbus 6 and the standalone crates
  # declared unmaintained; every released tauri-plugin-opener and
  # notify-rust (via tauri-plugin-notification) still requires zbus 5, so
  # these stay until those plugins move to zbus 6.
  "RUSTSEC-2026-0370", # zvariant
  "RUSTSEC-2026-0371", # zbus_names
  "RUSTSEC-2026-0372", # zvariant_derive
]
