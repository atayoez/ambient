<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <title>Ambient</title>

  <defs>
    <!-- Twilight sunset sky -->
    <linearGradient id="sky" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#15053D"/>
      <stop offset="0.45" stop-color="#5B21B6"/>
      <stop offset="0.78" stop-color="#EC4899"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>

    <!-- Soft sun halo -->
    <radialGradient id="sunGlow" cx="0.5" cy="0.58" r="0.4">
      <stop offset="0" stop-color="#FEF3C7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FEF3C7" stop-opacity="0"/>
    </radialGradient>

    <!-- Top gloss for glass-y depth on Liquid Glass / Mica -->
    <linearGradient id="gloss" x1="0.5" y1="0" x2="0.5" y2="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Squircle background -->
  <rect width="1024" height="1024" rx="230" ry="230" fill="url(#sky)"/>

  <!-- Sun halo -->
  <rect width="1024" height="1024" rx="230" ry="230" fill="url(#sunGlow)"/>

  <!-- Sun -->
  <circle cx="512" cy="592" r="142" fill="#FEF3C7"/>

  <!-- Back mountain ridge -->
  <path d="M 0 720 L 180 520 L 320 620 L 480 480 L 640 600 L 820 470 L 1024 620 L 1024 1024 L 0 1024 Z"
        fill="#1A0B3D" opacity="0.7"/>

  <!-- Front mountain ridge -->
  <path d="M 0 820 L 140 700 L 290 780 L 460 650 L 620 760 L 800 660 L 1024 820 L 1024 1024 L 0 1024 Z"
        fill="#0F0420"/>

  <!-- Glass top sheen -->
  <rect width="1024" height="1024" rx="230" ry="230" fill="url(#gloss)"/>

  <!-- Hairline inner ring for subtle bevel -->
  <rect x="2" y="2" width="1020" height="1020" rx="228" ry="228"
        fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
</svg>
