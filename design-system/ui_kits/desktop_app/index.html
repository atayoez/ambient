<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ambient — UI kit</title>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <link rel="stylesheet" href="styles.css" />
  <style>
    /* The desktop "behind" the Ambient window — a fake wallpaper so the
     * frosted-glass + backdrop-blur of the app reads correctly. */
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif;
      background: #050310;
    }
    body {
      background:
        radial-gradient(ellipse at 20% 25%, #4c1d95 0%, transparent 55%),
        radial-gradient(ellipse at 80% 75%, #be185d 0%, transparent 50%),
        radial-gradient(ellipse at 50% 100%, #f59e0b 0%, transparent 45%),
        linear-gradient(180deg, #1e1b4b 0%, #0c0a1f 100%);
    }
    /* mac-style desktop bezel: app window sits in the middle, sized to a
     * typical Ambient window. */
    .desktop {
      position: fixed; inset: 0;
      display: grid; place-items: center;
      padding: 28px;
    }
    .window-host {
      width: min(1100px, 100%);
      height: min(760px, 100%);
    }
    #root { width: 100%; height: 100%; }
  </style>

</head>
<body>
  <div class="desktop">
    <div class="window-host"><div id="root"></div></div>
  </div>

  <!-- One Babel script tag per JSX module. Components attach themselves to
       window so later scripts can use them. -->
  <script type="text/babel" src="components/icons.jsx"></script>
  <script type="text/babel" src="components/canvas.jsx"></script>
  <script type="text/babel" src="components/patterns.jsx"></script>
  <script type="text/babel" src="components/library.jsx"></script>
  <script type="text/babel" src="components/sources.jsx"></script>
  <script type="text/babel" src="components/generate.jsx"></script>
  <script type="text/babel" src="components/settings.jsx"></script>
  <script type="text/babel" src="components/app.jsx"></script>
</body>
</html>
