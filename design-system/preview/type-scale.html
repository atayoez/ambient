<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .scale { display: flex; flex-direction: column; gap: 14px; }
  .row { display: grid; grid-template-columns: 72px 1fr 100px; align-items: baseline; gap: 14px; }
  .sz { font-family: var(--font-mono); font-size: 10px; color: var(--muted); text-align: right; }
  .specimen { color: var(--text); }
  .use { font-family: var(--font-mono); font-size: 10px; color: var(--muted); }
</style></head>
<body><div class="preview-card">
  <div class="scale">
    <div class="row"><div class="sz">16px / 600</div><div class="specimen" style="font-size:16px; font-weight:600">Settings</div><div class="use">h1</div></div>
    <div class="row"><div class="sz">14px / 500</div><div class="specimen" style="font-size:14px; font-weight:500">Apply as wallpaper</div><div class="use">body, buttons</div></div>
    <div class="row"><div class="sz">13px / 400</div><div class="specimen" style="font-size:13px">Auto-rotate while the app is running</div><div class="use">body sm</div></div>
    <div class="row"><div class="sz">12px / 600</div><div class="specimen" style="font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted)">Section heading</div><div class="use">h2 eyebrow</div></div>
    <div class="row"><div class="sz">12px / 400</div><div class="specimen" style="font-size:12px; color:var(--muted)">~5–15s per image. Capped at ~2048/side.</div><div class="use">.muted</div></div>
    <div class="row"><div class="sz">11px / 400</div><div class="specimen" style="font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted)">generated · sunset (5 colors)</div><div class="use">.card-meta</div></div>
  </div>
</div></body></html>
