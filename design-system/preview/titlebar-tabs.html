<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .preview-card {
    padding: 0; display: flex; flex-direction: column; justify-content: center;
    background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0)),
                linear-gradient(180deg, var(--bg-tint-top), var(--bg-tint-bottom)),
                var(--bg-base), #0a0815;
  }
  .titlebar {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 0 6px; height: 42px;
  }
  .tabs {
    grid-column: 2; position: relative;
    display: inline-flex; align-items: center;
    background: rgba(0,0,0,0.28);
    backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 12px;
    padding: 3px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .tab-indicator {
    position: absolute; top: 3px; left: 3px;
    width: 88px; height: 28px;
    background: rgba(255,255,255,0.20);
    border-radius: 8px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.26),
                inset 0 -1px 0 rgba(0,0,0,0.08),
                0 1px 3px rgba(0,0,0,0.18);
    transform: translateX(176px);
    transition: transform 380ms cubic-bezier(0.32, 0.72, 0, 1);
    animation: slide 4s cubic-bezier(0.32, 0.72, 0, 1) infinite;
  }
  @keyframes slide {
    0%, 18%   { transform: translateX(0); }
    25%, 43%  { transform: translateX(88px); }
    50%, 68%  { transform: translateX(176px); }
    75%, 93%  { transform: translateX(264px); }
  }
  .tab {
    position: relative; width: 88px; height: 28px;
    padding: 0; background: transparent; border: none; outline: none;
    color: rgba(245,236,255,0.6); font-size: 12px; font-weight: 500;
    border-radius: 8px; z-index: 1;
    font-family: var(--font-sans);
  }
  .tab.active { color: var(--text); }
  .wc-group {
    grid-column: 3; justify-self: end;
    display: flex; gap: 2px; padding-right: 6px;
  }
  .wc {
    width: 26px; height: 26px; border-radius: 8px;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--muted);
  }
  .caption { padding: 0 22px 16px; font-family: var(--font-mono); font-size: 10px; color: var(--muted); text-align: center; }
</style></head>
<body><div class="preview-card">
  <header class="titlebar">
    <nav class="tabs">
      <div class="tab-indicator"></div>
      <button class="tab">Patterns</button>
      <button class="tab">Sources</button>
      <button class="tab active">Library</button>
      <button class="tab">Generate</button>
      <button class="tab">Settings</button>
    </nav>
    <div class="wc-group">
      <div class="wc">
        <svg width="10" height="10" viewBox="0 0 10 10"><line x1="2" y1="5" x2="8" y2="5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" /></svg>
      </div>
      <div class="wc">
        <svg width="10" height="10" viewBox="0 0 10 10"><rect x="2" y="2" width="6" height="6" stroke="currentColor" stroke-width="1.2" fill="none" rx="0.5" /></svg>
      </div>
      <div class="wc">
        <svg width="10" height="10" viewBox="0 0 10 10"><line x1="2.5" y1="2.5" x2="7.5" y2="7.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" /><line x1="7.5" y1="2.5" x2="2.5" y2="7.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" /></svg>
    </div>
    </div>
  </header>
  <div class="caption">Custom titlebar — sliding-pill tabs · 88×28 segments · 380ms ease-pill</div>
</div></body></html>
