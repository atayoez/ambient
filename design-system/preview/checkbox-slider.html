<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .preview-card { padding: 22px; }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; gap: 10px; align-items: center; font-size: 13px; color: var(--text); }
  .cb {
    width: 18px; height: 18px; border-radius: 5px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.16);
    position: relative; flex-shrink: 0;
  }
  .cb.checked {
    background: linear-gradient(180deg, #b794f6, #d6bcff);
    border-color: transparent;
    box-shadow: 0 1px 0 rgba(255,255,255,0.2) inset;
  }
  .cb.checked::after {
    content: ''; position: absolute; left: 5px; top: 1px;
    width: 4px; height: 9px;
    border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg);
  }
  .cb.hover { border-color: #b794f6; }
  .slider-wrap { display: flex; flex-direction: column; gap: 4px; }
  .slider-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; display: flex; justify-content: space-between; }
  .slider-label .num { text-transform: none; letter-spacing: 0; font-variant-numeric: tabular-nums; color: var(--muted); }
  input[type='range'] { width: 100%; accent-color: #b794f6; }
</style></head>
<body><div class="preview-card">
  <div class="stack">
    <div class="row"><div class="cb"></div>Auto-rotate while the app is running</div>
    <div class="row"><div class="cb hover"></div>Hover state — accent border</div>
    <div class="row"><div class="cb checked"></div>Checked — gradient fill, white tick</div>
    <div class="slider-wrap">
      <div class="slider-label">Randomness <span class="num">50%</span></div>
      <input type="range" min="0" max="100" value="50" />
    </div>
  </div>
</div></body></html>
