<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .preview-card { padding: 22px; display: flex; flex-direction: column; gap: 14px; }
  .empty {
    padding: 28px 20px; text-align: center; color: var(--muted);
    border: 1px dashed rgba(255,255,255,0.08); border-radius: 12px;
    line-height: 1.6; background: rgba(255,255,255,0.04);
    font-size: 13px;
  }
  .empty em { color: #b794f6; font-style: normal; font-weight: 600; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .status { color: var(--muted); font-size: 12px; }
  .error { color: #ff7a90; font-size: 12px; }
  .toast {
    background: rgba(110,231,163,0.18); color: #6ee7a3;
    padding: 5px 12px; border-radius: 999px;
    border: 1px solid rgba(110,231,163,0.32);
    font-size: 11px; backdrop-filter: blur(12px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.20);
  }
</style></head>
<body><div class="preview-card">
  <div class="empty">
    Empty library. Generate one from <em>Patterns</em>, pull from a curated <em>Source</em>, or prompt an AI in <em>Generate</em> — anything you apply lands here for re-use.
  </div>
  <div class="row">
    <span class="status">Rendering 3840×2160 at 2× for sharpness…</span>
    <span class="error">Failed to fetch — check your Unsplash key</span>
    <span class="toast">Saved</span>
  </div>
</div></body></html>
