<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .preview-card { display: flex; align-items: center; gap: 28px; padding: 18px 26px; }
  .icon-wrap { width: 116px; height: 116px; flex-shrink: 0; filter: drop-shadow(0 12px 28px rgba(0,0,0,0.4)); }
  .icon-wrap img { width: 100%; height: 100%; }
  .lockup-name {
    font-size: 28px; font-weight: 600; letter-spacing: -0.01em;
    background: linear-gradient(180deg, #f1ecff 0%, #d6bcff 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin: 0 0 4px;
  }
  .lockup-tag { font-size: 12px; color: var(--muted); margin: 0 0 12px; line-height: 1.5; }
  .lockup-meta { font-family: var(--font-mono); font-size: 10px; color: var(--muted); }
</style></head>
<body><div class="preview-card">
  <div class="icon-wrap"><img src="../assets/app-icon.svg" alt="Ambient app icon"></div>
  <div>
    <h1 class="lockup-name">Ambient</h1>
    <p class="lockup-tag">Wallpaper generator for Linux / macOS / Windows.<br>Pick colors, pick a pattern, render at your exact screen resolution.</p>
    <div class="lockup-meta">1024×1024 · squircle radius 230 · twilight sunset</div>
  </div>
</div></body></html>
