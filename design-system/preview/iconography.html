<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .preview-card { padding: 26px 30px; }
  .stack { display: flex; flex-direction: column; gap: 18px; }
  .group { display: flex; align-items: center; gap: 16px; }
  .group .head {
    width: 90px; font-family: var(--font-mono); font-size: 10px; color: var(--muted);
  }
  .row { display: flex; gap: 12px; }
  .glyph {
    width: 44px; height: 44px; border-radius: 8px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.08);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 22px; line-height: 1;
  }
  .glyph svg { color: var(--text); }
  .glyph.danger { background: #ff7a90; color: white; }
  .glyph.emoji { font-size: 22px; }
  .cap { font-family: var(--font-mono); font-size: 9.5px; color: var(--muted); text-align: center; max-width: 44px; margin-top: 4px; line-height: 1.3; }
  .cell { display: flex; flex-direction: column; align-items: center; }
</style></head>
<body><div class="preview-card">
  <div class="stack">
    <div class="group">
      <div class="head">window<br>controls</div>
      <div class="row">
        <div class="cell">
          <div class="glyph"><svg width="10" height="10" viewBox="0 0 10 10"><line x1="2" y1="5" x2="8" y2="5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" /></svg></div>
          <div class="cap">min</div>
        </div>
        <div class="cell">
          <div class="glyph"><svg width="10" height="10" viewBox="0 0 10 10"><rect x="2" y="2" width="6" height="6" stroke="currentColor" stroke-width="1.2" fill="none" rx="0.5" /></svg></div>
          <div class="cap">max</div>
        </div>
        <div class="cell">
          <div class="glyph danger"><svg width="10" height="10" viewBox="0 0 10 10"><line x1="2.5" y1="2.5" x2="7.5" y2="7.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" /><line x1="7.5" y1="2.5" x2="2.5" y2="7.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" /></svg></div>
          <div class="cap">close hover</div>
        </div>
      </div>
    </div>
    <div class="group">
      <div class="head">pattern<br>tab icons</div>
      <div class="row">
        <div class="cell"><div class="glyph emoji">🎨</div><div class="cap">mesh</div></div>
        <div class="cell"><div class="glyph emoji">🔺</div><div class="cap">geometric</div></div>
        <div class="cell"><div class="glyph emoji">🔘</div><div class="cap">dots</div></div>
        <div class="cell"><div class="glyph emoji">🦓</div><div class="cap">stripes</div></div>
        <div class="cell"><div class="glyph emoji">😀</div><div class="cap">emoji</div></div>
      </div>
    </div>
    <div class="group">
      <div class="head">glyphs</div>
      <div class="row">
        <div class="cell"><div class="glyph" style="font-size:14px">↻</div><div class="cap">re-roll</div></div>
        <div class="cell"><div class="glyph" style="font-size:20px">+</div><div class="cap">add</div></div>
        <div class="cell"><div class="glyph" style="font-size:14px; background:#ff7a90; color:white; width:18px; height:18px; border-radius:999px; border:none">×</div><div class="cap" style="margin-top:14px">remove</div></div>
      </div>
    </div>
  </div>
</div></body></html>
