<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .preview-card { padding: 26px 28px; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
  .eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; margin: 0; }
  .h1 { font-size: 16px; font-weight: 600; color: var(--text); margin: 0; }
  .body { font-size: 14px; color: var(--text); margin: 0; line-height: 1.5; }
  .muted { font-size: 12px; color: var(--muted); margin: 0; line-height: 1.5; }
</style></head>
<body><div class="preview-card">
  <p class="eyebrow">Section heading</p>
  <h1 class="h1">Settings</h1>
  <p class="body">Configure your provider, resolution, and rotation cadence.</p>
  <p class="muted">Free image generation via Pollinations. ~5–15s per image.</p>
</div></body></html>
