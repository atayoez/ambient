<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .row { gap: 20px; align-items: center; padding-top: 10px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  .box {
    width: 96px; height: 60px; border-radius: 10px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.16);
  }
  .b1 { box-shadow: 0 32px 80px rgba(0,0,0,0.35); }
  .b2 { box-shadow: 0 12px 32px rgba(0,0,0,0.35); }
  .b3 { box-shadow: 0 8px 24px rgba(0,0,0,0.20); border-radius: 999px; padding: 0 14px; width: auto; height: 28px; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; color: #6ee7a3; background: rgba(110,231,163,0.18); border-color: rgba(110,231,163,0.32); }
  .b4 { box-shadow: inset 0 1px 0 rgba(255,255,255,0.18); }
  .nm { font-family: var(--font-mono); font-size: 10px; color: var(--text); text-align: center; }
  .val { font-family: var(--font-mono); font-size: 9px; color: var(--muted); text-align: center; line-height: 1.3; }
</style></head>
<body><div class="preview-card">
  <div class="row">
    <div class="cell"><div class="box b1"></div><div class="nm">--shadow-window</div><div class="val">0 32px 80px rgba(0,0,0,0.35)</div></div>
    <div class="cell"><div class="box b2"></div><div class="nm">--shadow-overlay</div><div class="val">0 12px 32px rgba(0,0,0,0.35)</div></div>
    <div class="cell"><div class="box b3">Saved</div><div class="nm">--shadow-toast</div><div class="val">0 8px 24px rgba(0,0,0,0.20)</div></div>
    <div class="cell"><div class="box b4"></div><div class="nm">--inset-sheen</div><div class="val">inset 0 1px 0 rgba(255,255,255,0.18)</div></div>
  </div>
</div></body></html>
