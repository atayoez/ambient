# Cross-platform CI for Ambient.
#
# - check: fast TypeScript + Biome + cargo tests on Ubuntu. Gates every
#   downstream job. Runs on push, PR, dispatch, and tag-push.
# - build-tauri: arch matrix —
#     macOS aarch64 (.dmg + signed .app.tar.gz for the updater)
#     Windows x86_64 (.msi + .msi.sig)
#     Windows aarch64 (.msi + .msi.sig)
#     Linux aarch64 (.deb + .rpm)                  ← native ARM runner
#     Linux x86_64 (.deb + .rpm)
#   Gated to tag pushes (`refs/tags/v*`) and manual dispatch so plain
#   main pushes only spend the cheap `check` minutes — macOS runners
#   are ~10× priced on the free tier.
# - build-arch: repackages the x86_64 .deb into a native Arch
#   .pkg.tar.zst via makepkg in an archlinux container.
# - release: depends on build-tauri + build-arch, runs only on tag push.
#   Renames artifacts to the release filename convention, uploads them
#   to R2, generates latest.json (`downloads.*` aliases for the worker +
#   signed `platforms.*` for tauri-plugin-updater — macOS/Windows only;
#   Linux native packages update via the system package manager), and
#   cuts the GitHub release with everything attached + CHANGELOG notes.
#   Linux ships native packages only — no AppImage (its bundled GPU libs
#   blank-screened on some hosts; native packages use system WebKitGTK).
#
# Release flow from the developer's side: `bun run release X.Y.Z`,
# which is now just version-bump + commit + tag + push. The tag-push
# trigger here is what actually publishes.

name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  # paths-ignore on PRs only — never on push, so a tag push (= a release)
  # always builds regardless of which files the release commit touched.
  # Docs/website/marketing-only PRs don't need the full Rust compile +
  # tests; deploy-site.yml covers website/** independently.
  pull_request:
    paths-ignore:
      - 'website/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

# Collapse superseded runs: a new push to a branch/PR cancels the older
# in-flight run for that same ref, so we don't pay for `check` (full Rust
# workspace compile + tests) twice on a rapid re-push. Tag refs get their
# own per-tag group with cancel-in-progress OFF — a tag build is a release
# in progress and must never be killed mid-publish.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    name: TypeScript + lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14  # pinned for reproducibility; Renovate bumps it

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bun x tsc --noEmit

      - name: Biome check
        run: bun run lint

      # Fails if the committed Plasma .frag shaders drifted from their single
      # source (src/lib/shaders.ts). Text-only diff — no Qt/qsb needed here.
      - name: Plasma shaders in sync
        run: bun run check:shaders

      - name: Vitest (JS unit tests)
        run: bun run test

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cargo cache for tests
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        continue-on-error: true
        with:
          workspaces: './src-tauri -> target'
          key: check-x86_64

      - name: Install Linux dev libs (for cargo test link)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Cargo tests (Rust unit tests)
        working-directory: ./src-tauri
        # --workspace so the ambient-core member's tests run too — from
        # the root package dir a bare `cargo test --lib` would only test
        # the (test-less) shell crate.
        run: cargo test --workspace --lib

  build-tauri:
    name: Build (${{ matrix.platform }} / ${{ matrix.arch }})
    needs: check
    # Tag push OR manual dispatch only — main pushes get just the cheap
    # `check` above.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            arch: aarch64
            # .dmg is the installer download; the signed updater
            # artifact is the .app.tar.gz (Tauri never signs the .dmg).
            artifact-glob: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app.tar.gz
              src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          - platform: windows-latest
            arch: x86_64
            artifact-glob: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/msi/*.msi.sig
          - platform: windows-11-arm
            arch: aarch64
            artifact-glob: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/msi/*.msi.sig
          - platform: ubuntu-22.04-arm
            arch: aarch64
            artifact-glob: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
          - platform: ubuntu-22.04
            arch: x86_64
            artifact-glob: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14  # pinned for reproducibility; Renovate bumps it

      - name: Install Linux dev libs
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # rust-cache restore occasionally flakes mid-extract on Windows
      # runners; don't fail the whole job because of a cache miss/restore
      # error — the build will just rebuild from scratch this run.
      - name: Cache Rust build
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        continue-on-error: true
        with:
          workspaces: './src-tauri -> target'
          # Distinct cache slots per arch — otherwise an arm64 build
          # would clobber the x64 incremental cache and vice versa.
          key: ${{ matrix.platform }}-${{ matrix.arch }}

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build the app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri auto-signs the updater bundles when this is set: the
          # macOS .app.tar.gz and the Windows .msi (.sig files land next to
          # them and drive latest.json). Linux ships native packages
          # (deb/rpm/pacman) which update via the system package manager,
          # so there's no Linux updater artifact to sign.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ambient-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: warn
          # These are an intermediate hop: the release job downloads them
          # within the same run, and finish-release.yml's rescue path reuses
          # them for a few days. 90-day default piled up GB of installers and
          # blew the account artifact-storage quota (which failed a release
          # mid-publish). A week keeps the rescue window without the pile-up.
          retention-days: 7

  # Native Arch package. Tauri v2 has no pacman bundler, so we repackage
  # the x86_64 .deb (built by build-tauri) into a .pkg.tar.zst via makepkg.
  # makepkg only runs on Arch and refuses to run as root, so we do the
  # packaging inside an `archlinux` container via `docker run` — the job
  # itself stays on ubuntu so the JS actions (checkout/download/upload)
  # have the node the runner provides (an archlinux *container* wouldn't).
  build-arch:
    name: Build Arch package (x86_64)
    needs: build-tauri
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Download x86_64 Linux artifacts (.deb)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ambient-ubuntu-22.04-x86_64
          path: linux-x64
      - name: Repackage .deb → .pkg.tar.zst (makepkg in archlinux)
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD":/work -w /work archlinux:latest bash -c '
            set -euo pipefail
            pacman -Sy --noconfirm --needed base-devel >/dev/null
            useradd -m builder
            chown -R builder:builder /work
            DEB=$(find linux-x64 -name "*.deb" | head -1)
            base=$(basename "$DEB"); tmp=${base#Ambient_}; VERSION=${tmp%_amd64.deb}
            echo "Building Arch package for version $VERSION from $DEB"
            runuser -u builder -- ./scripts/build-arch-pkg.sh "$VERSION" "$DEB" /work/arch-out
          '
      - name: Upload arch artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ambient-arch-x86_64
          path: arch-out/*.pkg.tar.*
          retention-days: 7

  release:
    name: Publish release
    needs: [build-tauri, build-arch]
    # Tag push only. Manual dispatch builds without publishing — useful
    # for testing the matrix on a feature branch without cutting a
    # release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write  # for gh release create
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14  # pinned for reproducibility; Renovate bumps it

      - name: Extract version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          pattern: ambient-*

      - name: Publish to R2 + GitHub Releases
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Hardcoded so the token doesn't need /memberships access;
          # same ID we use in deploy-site.yml. Not a secret.
          CLOUDFLARE_ACCOUNT_ID: '848c6419822ef3e91b6f66d69ebe63eb'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GPG key for signing the rpms (see ci-publish.sh "Signing RPMs").
          RPM_GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY }}
          RPM_GPG_PASSPHRASE: ${{ secrets.RPM_GPG_PASSPHRASE }}
        run: ./scripts/ci-publish.sh "${{ steps.ver.outputs.version }}"
