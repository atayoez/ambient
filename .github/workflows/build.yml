# Cross-platform CI for Ambient.
#
# - check: fast TypeScript + Biome pass on Ubuntu. Gates the build.
# - build-tauri: three-arch matrix —
#     macOS aarch64 (.dmg)
#     Windows x86_64 (.msi)
#     Windows aarch64 (.msi)
#   Both Linux variants are built locally by scripts/release.sh:
#   x86_64 against the host webkit2gtk-4.1 toolchain, aarch64 via
#   Docker + QEMU (scripts/build-linux-arm64.sh). The build-tauri
#   matrix is gated to workflow_dispatch so it only fires when
#   release.sh kicks it off — saves macOS minutes (~10×-priced on
#   free-tier) on every-push runs that don't need binaries.
#
# Triggered on push to main and on PRs.

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: TypeScript + lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bun x tsc --noEmit

      - name: Biome check
        run: bun run lint

      - name: Vitest (JS unit tests)
        run: bun run test

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache for tests
        uses: swatinem/rust-cache@v2
        continue-on-error: true
        with:
          workspaces: './src-tauri -> target'
          key: check-x86_64

      - name: Install Linux dev libs (for cargo test link)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Cargo tests (Rust unit tests)
        working-directory: ./src-tauri
        run: cargo test --lib

  build-tauri:
    name: Build (${{ matrix.platform }} / ${{ matrix.arch }})
    needs: check
    # Dispatch-only. scripts/release.sh fires `gh workflow run` after
    # the version-bump commit; pushes / PRs only spend the cheap
    # `check` minutes above.
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            arch: aarch64
            artifact-glob: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app.tar.gz
          - platform: windows-latest
            arch: x86_64
            artifact-glob: |
              src-tauri/target/release/bundle/msi/*.msi
          - platform: windows-11-arm
            arch: aarch64
            artifact-glob: |
              src-tauri/target/release/bundle/msi/*.msi
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # rust-cache restore occasionally flakes mid-extract on Windows
      # runners; don't fail the whole job because of a cache miss/restore
      # error — the build will just rebuild from scratch this run.
      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        continue-on-error: true
        with:
          workspaces: './src-tauri -> target'
          # Distinct cache slots per arch — otherwise an arm64 build
          # would clobber the x64 incremental cache and vice versa.
          key: ${{ matrix.platform }}-${{ matrix.arch }}

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri auto-signs each bundle when the env var is present.
          # Stored as a GH repo secret; pasted contents of the
          # ~/.config/ambient/updater-private.key file. Leave empty
          # secret = signing skipped, plugin updater inactive that
          # release.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ambient-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: warn
