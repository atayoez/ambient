# Cross-platform CI for Ambient.
#
# - check: fast TypeScript + Biome pass on Ubuntu. Gates the build.
# - build-tauri: macOS .dmg and Windows .exe/.msi via tauri-action.
# - build-flatpak: Linux .flatpak via flatpak-builder against the
#   project's existing manifest. Native AppImage/.deb intentionally
#   dropped — flatpak is the only Linux ship target.
#
# Triggered on push to main and on PRs.

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: TypeScript + lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bun x tsc --noEmit

      - name: Biome check
        run: bun run lint

  build-tauri:
    name: Build (${{ matrix.platform }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            artifact-glob: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app.tar.gz
          - platform: windows-latest
            artifact-glob: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # rust-cache restore occasionally flakes mid-extract on Windows
      # runners; don't fail the whole job because of a cache miss/restore
      # error — the build will just rebuild from scratch this run.
      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        continue-on-error: true
        with:
          workspaces: './src-tauri -> target'

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ambient-${{ matrix.platform }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: warn

  build-flatpak:
    name: Build (flatpak)
    needs: check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # flatpak-builder + the freedesktop SDK extensions the manifest
      # depends on (rust-stable + node20). Pulled from Flathub.
      - name: Install flatpak + flatpak-builder
        run: |
          sudo apt update
          sudo apt install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          # GNOME 46 = freedesktop 24.08 underneath, so the freedesktop
          # SDK extensions (rust-stable / node20) at //24.08 are the
          # right pair to use here.
          flatpak install --user -y --noninteractive flathub \
            org.gnome.Platform//46 \
            org.gnome.Sdk//46 \
            org.freedesktop.Sdk.Extension.rust-stable//24.08 \
            org.freedesktop.Sdk.Extension.node20//24.08

      # Cache the .flatpak-builder/cache so cargo + npm deps survive
      # between runs; otherwise every CI is a full cold rebuild.
      - name: Cache flatpak-builder dir
        uses: actions/cache@v4
        with:
          path: |
            .flatpak-builder
          key: flatpak-${{ runner.os }}-${{ hashFiles('flatpak/com.ambient.app.yaml', 'src-tauri/Cargo.lock', 'package.json') }}
          restore-keys: |
            flatpak-${{ runner.os }}-

      - name: Build flatpak
        run: |
          flatpak-builder --user --force-clean \
            --repo=repo \
            build-dir \
            flatpak/com.ambient.app.yaml
          flatpak build-bundle repo ambient.flatpak com.ambient.app

      - name: Upload flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: ambient-flatpak
          path: ambient.flatpak
          if-no-files-found: error
