# Cross-platform CI for Ambient.
#
# - check: fast TypeScript + Biome + cargo tests on Ubuntu. Gates every
#   downstream job. Runs on push, PR, dispatch, and tag-push.
# - build-tauri: five-arch matrix —
#     macOS aarch64 (.dmg + .dmg.sig)
#     Windows x86_64 (.msi + .msi.sig)
#     Windows aarch64 (.msi + .msi.sig)
#     Linux aarch64 (.AppImage + .AppImage.sig)   ← native ARM runner
#     Linux x86_64 (.AppImage + .AppImage.sig)
#   Gated to tag pushes (`refs/tags/v*`) and manual dispatch so plain
#   main pushes only spend the cheap `check` minutes — macOS runners
#   are ~10× priced on the free tier.
# - release: depends on the full matrix, runs only on tag push. Renames
#   the 5 artifacts to the release filename convention, uploads them
#   to R2, generates dual-shape latest.json (legacy `downloads.*` for
#   the worker's /downloads/latest aliases + signed `platforms.*` for
#   tauri-plugin-updater), and cuts the GitHub release with all 5
#   attached + notes pulled from CHANGELOG.md.
#
# Release flow from the developer's side: `bun run release X.Y.Z`,
# which is now just version-bump + commit + tag + push. The tag-push
# trigger here is what actually publishes.

name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: TypeScript + lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bun x tsc --noEmit

      - name: Biome check
        run: bun run lint

      - name: Vitest (JS unit tests)
        run: bun run test

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache for tests
        uses: swatinem/rust-cache@v2
        continue-on-error: true
        with:
          workspaces: './src-tauri -> target'
          key: check-x86_64

      - name: Install Linux dev libs (for cargo test link)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Cargo tests (Rust unit tests)
        working-directory: ./src-tauri
        run: cargo test --lib

  build-tauri:
    name: Build (${{ matrix.platform }} / ${{ matrix.arch }})
    needs: check
    # Tag push OR manual dispatch only — main pushes get just the cheap
    # `check` above.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            arch: aarch64
            # .dmg is the installer download; the signed updater
            # artifact is the .app.tar.gz (Tauri never signs the .dmg).
            artifact-glob: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app.tar.gz
              src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          - platform: windows-latest
            arch: x86_64
            artifact-glob: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/msi/*.msi.sig
          - platform: windows-11-arm
            arch: aarch64
            artifact-glob: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/msi/*.msi.sig
          - platform: ubuntu-22.04-arm
            arch: aarch64
            artifact-glob: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/appimage/*.AppImage.sig
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
          - platform: ubuntu-22.04
            arch: x86_64
            artifact-glob: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/appimage/*.AppImage.sig
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux dev libs
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # rust-cache restore occasionally flakes mid-extract on Windows
      # runners; don't fail the whole job because of a cache miss/restore
      # error — the build will just rebuild from scratch this run.
      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        continue-on-error: true
        with:
          workspaces: './src-tauri -> target'
          # Distinct cache slots per arch — otherwise an arm64 build
          # would clobber the x64 incremental cache and vice versa.
          key: ${{ matrix.platform }}-${{ matrix.arch }}

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri auto-signs each bundle when this env var is set. The
          # .sig files end up next to the bundle artifact (.dmg.sig,
          # .msi.sig, .AppImage.sig) and ship as part of the upload
          # artifact for the release job to read into latest.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # tauri's bundling step occasionally fails the linuxdeploy
      # invocation even though the AppDir is fine. Detect a missing
      # .AppImage and re-run linuxdeploy manually using the extracted
      # AppRun (CI runners don't have FUSE so we can't exec the
      # AppImage directly).
      - name: Fallback AppImage bundling for Linux
        if: startsWith(matrix.platform, 'ubuntu-')
        shell: bash
        run: |
          APPIMAGE_DIR="src-tauri/target/release/bundle/appimage"
          if ls "$APPIMAGE_DIR"/*.AppImage >/dev/null 2>&1; then
            echo "AppImage produced by tauri-action; no fallback needed."
            exit 0
          fi
          echo "Tauri didn't emit AppImage. Running linuxdeploy manually."
          ARCH=$(uname -m)
          curl -L -o /tmp/linuxdeploy.AppImage \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${ARCH}.AppImage"
          chmod +x /tmp/linuxdeploy.AppImage
          (cd /tmp && ./linuxdeploy.AppImage --appimage-extract >/dev/null)
          cd "$GITHUB_WORKSPACE/$APPIMAGE_DIR"
          NO_STRIP=true /tmp/squashfs-root/AppRun \
            --appdir Ambient.AppDir --output appimage

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ambient-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: warn

  # Native Arch package. Tauri v2 has no pacman bundler, so we repackage
  # the x86_64 .deb (built by build-tauri) into a .pkg.tar.zst via makepkg.
  # makepkg only runs on Arch and refuses to run as root, so we do the
  # packaging inside an `archlinux` container via `docker run` — the job
  # itself stays on ubuntu so the JS actions (checkout/download/upload)
  # have the node the runner provides (an archlinux *container* wouldn't).
  build-arch:
    name: Build Arch package (x86_64)
    needs: build-tauri
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Download x86_64 Linux artifacts (.deb)
        uses: actions/download-artifact@v8
        with:
          name: ambient-ubuntu-22.04-x86_64
          path: linux-x64
      - name: Repackage .deb → .pkg.tar.zst (makepkg in archlinux)
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD":/work -w /work archlinux:latest bash -c '
            set -euo pipefail
            pacman -Sy --noconfirm --needed base-devel >/dev/null
            useradd -m builder
            chown -R builder:builder /work
            DEB=$(find linux-x64 -name "*.deb" | head -1)
            base=$(basename "$DEB"); tmp=${base#Ambient_}; VERSION=${tmp%_amd64.deb}
            echo "Building Arch package for version $VERSION from $DEB"
            runuser -u builder -- ./scripts/build-arch-pkg.sh "$VERSION" "$DEB" /work/arch-out
          '
      - name: Upload arch artifact
        uses: actions/upload-artifact@v7
        with:
          name: ambient-arch-x86_64
          path: arch-out/*.pkg.tar.*

  release:
    name: Publish release
    needs: [build-tauri, build-arch]
    # Tag push only. Manual dispatch builds without publishing — useful
    # for testing the matrix on a feature branch without cutting a
    # release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write  # for gh release create
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Extract version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: ambient-*

      - name: Publish to R2 + GitHub Releases
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Hardcoded so the token doesn't need /memberships access;
          # same ID we use in deploy-site.yml. Not a secret.
          CLOUDFLARE_ACCOUNT_ID: '848c6419822ef3e91b6f66d69ebe63eb'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/ci-publish.sh "${{ steps.ver.outputs.version }}"
