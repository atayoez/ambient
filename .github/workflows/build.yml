# Cross-platform CI for Ambient.
#
# - check: fast TypeScript + Biome pass on Ubuntu. Gates the build.
# - build-tauri: macOS .dmg and Windows .exe/.msi via tauri-action.
# - build-flatpak: Linux .flatpak via flatpak-builder against the
#   project's existing manifest. Native AppImage/.deb intentionally
#   dropped — flatpak is the only Linux ship target.
#
# Triggered on push to main and on PRs.

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: TypeScript + lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bun x tsc --noEmit

      - name: Biome check
        run: bun run lint

  build-tauri:
    name: Build (${{ matrix.platform }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            artifact-glob: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app.tar.gz
          - platform: windows-latest
            artifact-glob: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # rust-cache restore occasionally flakes mid-extract on Windows
      # runners; don't fail the whole job because of a cache miss/restore
      # error — the build will just rebuild from scratch this run.
      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        continue-on-error: true
        with:
          workspaces: './src-tauri -> target'

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ambient-${{ matrix.platform }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: warn

  # Flatpak builds are slow (~30 min cold) because of the GNOME runtime
  # download + cargo cold compile. Restrict to tagged releases and
  # manual dispatch — every-push flatpak builds would make merges
  # painful for no benefit (the macOS+Windows jobs already prove the
  # frontend + Rust code compiles).
  build-flatpak:
    name: Build (flatpak)
    needs: check
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-46
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ambient.flatpak
          manifest-path: flatpak/com.ambient.app.yaml
          cache-key: flatpak-${{ hashFiles('flatpak/com.ambient.app.yaml', 'src-tauri/Cargo.lock', 'package.json') }}
