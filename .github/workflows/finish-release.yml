# Finish a stuck release on the self-hosted runner — no GitHub-hosted
# minutes, so it works even when the account is over its Actions spending
# limit (which is exactly when the normal tag build can't run).
#
# It reuses the desktop/Linux app artifacts that a prior build run already
# produced (download-artifact keeps them ~90 days), builds the missing
# Arch package locally, signs the rpms, and publishes — entirely on the
# self-hosted Arch box.
#
# Trigger:
#   gh workflow run finish-release.yml -f version=1.0.3 -f source_run=<run-id>
# where <run-id> is the Build run whose build-tauri jobs succeeded.

name: Finish release (self-hosted)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix (e.g. 1.0.3)
        required: true
      source_run:
        description: Build run ID to reuse the platform artifacts from
        required: true

# Serialize rescue publishes so two manual runs can't race on the same R2
# upload / GitHub release. cancel-in-progress is OFF — never kill a publish
# mid-flight; queue the second run behind the first instead.
concurrency:
  group: finish-release
  cancel-in-progress: false

jobs:
  finish:
    runs-on: [self-hosted]
    permissions:
      contents: write   # gh release create/edit
      actions: read     # gh run download from another run
    env:
      # The self-hosted box has podman (docker is a thin shim); be explicit
      # so ci-publish.sh's container signing uses it directly.
      CONTAINER: podman
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Reuse platform artifacts from the source run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf dist && mkdir -p dist
          gh run download "${{ inputs.source_run }}" -p 'ambient-*' -D dist
          echo "Downloaded:"; ls dist

      - name: Build the Arch package from the x86_64 .deb
        run: |
          set -euo pipefail
          DEB=$(find dist/ambient-ubuntu-22.04-x86_64 -name '*.deb' | head -1)
          test -n "$DEB"
          ./scripts/build-arch-pkg.sh "${{ inputs.version }}" "$DEB" dist/ambient-arch-x86_64
          ls dist/ambient-arch-x86_64

      - name: Publish to R2 + GitHub Releases (signs rpms in a container)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '848c6419822ef3e91b6f66d69ebe63eb'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RPM_GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY }}
          RPM_GPG_PASSPHRASE: ${{ secrets.RPM_GPG_PASSPHRASE }}
        run: ./scripts/ci-publish.sh "${{ inputs.version }}"
