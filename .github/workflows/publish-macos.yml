# Build + publish ONLY the macOS build, and merge it into the live release.
#
# macOS is the one target that can't be built on the dev box (Apple SDK +
# bundler are Mac-locked), so it lags the local Linux/Windows publish. This
# workflow_dispatch job builds the signed macOS bundle on a Mac runner, then
# runs the same partial-aware publisher the dev box uses (scripts/
# publish-local.sh) on an ubuntu runner — it fetches the LIVE latest.json,
# merges in ONLY the macOS 1.2.0 entry (leaving Linux/Windows untouched),
# uploads the .dmg/.app.tar.gz + manifest to R2, and attaches the .dmg to the
# GitHub release. Trigger:  gh workflow run publish-macos.yml -f version=1.2.0
#
# Used by the scheduled "Ambient macOS publish" routine on the 1st of the
# month, once the GitHub Actions minute allowance has reset.
name: Publish macOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (no v prefix)
        required: true
        default: "1.2.0"

jobs:
  build-mac:
    name: Build macOS (aarch64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - run: bun install --frozen-lockfile
      - name: Build the macOS app (signed updater artifact)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ambient-macos-latest-aarch64
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  publish-mac:
    name: Merge macOS into the live release
    needs: build-mac
    runs-on: ubuntu-latest
    permissions:
      contents: write # for gh release upload
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Download the macOS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ambient-macos-latest-aarch64
          path: dist/ambient-macos-latest-aarch64
      - name: Publish (partial-aware — only macOS touched)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '848c6419822ef3e91b6f66d69ebe63eb'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish-local.sh "${{ inputs.version }}"
